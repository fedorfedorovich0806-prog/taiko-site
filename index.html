<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TaikoVPN</title>
<style>
  :root { --bg:#0d0f22; --card:#171a38; --line:#2b2f63; --text:#f2f4ff; --muted:#8e97c4; --a:#00e5ff; --b:#5070ff; --c:#aa46ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:radial-gradient(900px 500px at 50% 110%, #3a1d7a55, transparent), var(--bg); }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:28px;
          padding:32px 24px; text-align:center; }
  img { width:112px; height:112px; border-radius:50%; }
  h1 { margin:16px 0 4px; font-size:30px; }
  h1 span { background:linear-gradient(90deg,var(--a),var(--c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:block; padding:16px; border-radius:999px; color:#fff; text-decoration:none; font-weight:700;
          background:linear-gradient(90deg,var(--a),var(--b) 55%,var(--c)); }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="TaikoVPN">
  <h1>Taiko<span>VPN</span></h1>
  <p id="msg">VPN для тех, кого бесит пинг.</p>
  <a class="btn" id="go" href="https://t.me/taikovpnbot">Открыть бота в Telegram</a>
</div>
<script>
  // Invite links:  https://YOUR-DOMAIN/?invite=123  ->  the bot with the referral code
  const BOT = 'taikovpnbot';
  const invite = new URLSearchParams(location.search).get('invite');
  if (invite && /^\d{1,20}$/.test(invite)) {
    const tg = 'https://t.me/' + BOT + '?start=ref_' + invite;
    document.getElementById('go').href = tg;
    document.getElementById('msg').textContent = 'Открываем Telegram…';
    setTimeout(() => location.replace(tg), 250);
  }
</script>
</body>
</html>
